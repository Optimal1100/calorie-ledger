<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calorie Ledger tests</title>
<style>
  body{font:14px/1.4 -apple-system,system-ui,sans-serif;margin:16px;color:#111;background:#fff}
  .p{color:#1d7a52}.f{color:#c0392b}pre{white-space:pre-wrap;margin:2px 0 8px 16px;font-size:12px}small{color:#888}
  iframe{width:390px;height:780px;border:1px solid #ccc;border-radius:12px;float:right;margin-left:16px}
  nav a{margin-right:12px}
</style>
</head>
<body>
<nav><a href="?suite=core">Core logic</a><a href="?suite=ui">App (UI)</a><a href="?suite=all">All</a></nav>
<iframe id="app" title="App under test"></iframe>
<div id="out">Loading…</div>
<script type="module">
  import {run} from "./harness.js";
  const suite = new URLSearchParams(location.search).get("suite") || "all";
  if (suite !== "ui") await import("./core.test.js");
  if (suite !== "core") await import("./ui.test.js"); else document.getElementById("app").remove();
  await run(`Calorie Ledger ${suite} tests`);
</script>
</body>
</html>
